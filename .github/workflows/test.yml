name: Go contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        go: ['1.25.8', '1.26.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Format
        run: test -z "$(gofmt -l main.go cmd internal)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...

  terraform-protocol:
    strategy:
      matrix:
        terraform: ['1.14.0', '1.14.2']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.8'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Test protocol with synthetic API fixtures only
        env:
          IWINV_PROTOCOL_TEST: '1'
        run: TF_ACC_TERRAFORM_PATH="$(command -v terraform)" go test -race ./internal/provider -run TestProtocol -v
      - name: Validate examples with the actual provider binary
        run: |
          go build -o bin/terraform-provider-iwinv .
          terraform fmt -check -recursive examples
          cat > "$RUNNER_TEMP/iwinv.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "dokdo2013/iwinv" = "$GITHUB_WORKSPACE/bin"
            }
            direct {}
          }
          EOF
          for example in examples/data-sources/* examples/resources/*; do
            TF_CLI_CONFIG_FILE="$RUNNER_TEMP/iwinv.tfrc" terraform -chdir="$example" validate
          done
