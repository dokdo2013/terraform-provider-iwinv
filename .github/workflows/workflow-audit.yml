name: Workflow audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.1'
          cache: false
      - name: Validate workflow syntax, expressions and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Install hash-locked workflow security analyzer
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-audit"
          "$RUNNER_TEMP/workflow-audit/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-workflow.txt
      - name: Audit all workflows without credentials or online audits
        run: '"$RUNNER_TEMP/workflow-audit/bin/zizmor" --offline --no-progress --persona pedantic --min-severity low .github/workflows'
